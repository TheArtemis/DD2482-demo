name: Unit tests

on: push

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install -r blue-green-demo/assets/requirements.txt
      - name: Run unit tests
        run: python -m unittest discover -s blue-green-demo/tests -v
