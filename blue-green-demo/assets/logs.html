<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Live deployment logs</title>
  <style>
    body { margin: 0; background: #111827; color: #e5e7eb; font: 16px system-ui, sans-serif; }
    main { box-sizing: border-box; display: flex; flex-direction: column; width: 100%; max-width: 1100px;
           height: 100vh; height: 100dvh; margin: 0 auto; padding: 24px; }
    header { display: flex; justify-content: space-between; align-items: baseline; gap: 16px; flex-wrap: wrap; }
    h1 { margin: 0 0 8px; font-size: 1.6rem; }
    p { color: #9ca3af; }
    a { color: #93c5fd; }
    #status { font-size: .9rem; }
    pre { box-sizing: border-box; flex: 1; min-height: 0; margin: 0; overflow: auto; padding: 20px; border: 1px solid #374151;
          border-radius: 8px; background: #030712; color: #d1fae5; font: 14px/1.5 ui-monospace, SFMono-Regular, Menlo, monospace;
          white-space: pre-wrap; overflow-wrap: anywhere; }
  </style>
</head>
<body>
  <main>
    <header>
      <div>
        <h1>Live deployment logs</h1>
        <p>GitHub <code>release</code> branch · refreshes every 2 seconds · <a href="/">back to app</a></p>
      </div>
      <span id="status">Connecting…</span>
    </header>
    <pre id="deployment" aria-live="polite">Waiting for deployment output…</pre>
  </main>
  <script>
    const status = document.getElementById('status');
    const output = document.getElementById('deployment');
    async function update(url, output, emptyText) {
      const response = await fetch(url, { cache: 'no-store' });
      if (!response.ok) throw new Error(`${url}: HTTP ${response.status}`);
      const text = await response.text();
      const atBottom = output.scrollTop + output.clientHeight >= output.scrollHeight - 30;
      if (output.textContent !== text) {
        output.textContent = text || emptyText;
        if (atBottom) output.scrollTop = output.scrollHeight;
      }
    }
    async function refresh() {
      try {
        await update('/logs/deploy.log', output, 'Waiting for deployment output…');
        status.textContent = 'Connected';
      } catch (error) {
        status.textContent = `Log unavailable: ${error.message}`;
      }
    }
    refresh();
    setInterval(refresh, 2000);
  </script>
</body>
</html>
