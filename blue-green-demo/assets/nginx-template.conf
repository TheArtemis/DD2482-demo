server {
    listen 80 default_server;
    access_log /opt/cd-demo/nginx-access.log;
    error_log /opt/cd-demo/nginx-error.log warn;

    location = /logs {
        default_type text/html;
        add_header Cache-Control "no-store";
        alias /opt/cd-demo/logs.html;
    }

    location = /logs/deploy.log {
        access_log off;
        default_type text/plain;
        add_header Cache-Control "no-store";
        alias /opt/cd-demo/deploy.log;
    }

    location = /logs/nginx-access.log {
        access_log off;
        default_type text/plain;
        add_header Cache-Control "no-store";
        alias /opt/cd-demo/nginx-access.log;
    }

    location = /logs/nginx-error.log {
        access_log off;
        default_type text/plain;
        add_header Cache-Control "no-store";
        alias /opt/cd-demo/nginx-error.log;
    }

    location / {
        proxy_pass http://127.0.0.1:__PORT__;
    }
}
